<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Work Permit Management</title>
    <!-- Tailwind CSS via CDN -->

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <!-- QR Code Generator & Scanner Libraries -->

    <style>
        /* Custom styles */
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f0f2f5;
        }
        .hidden { display: none; }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #166534; /* Dark Green */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-pending-hr, .status-pending { background-color: #fef3c7; color: #92400e; }
        .status-pending-gm { background-color: #dbeafe; color: #1e40af; }
        .status-approved, .status-active { background-color: #d1fae5; color: #065f46; }
        .status-rejected { background-color: #fee2e2; color: #991b1b; }
        
        /* Sidebar styles */
        #sidebar {
            transition: transform 0.3s ease-in-out;
        }
        #main-content-wrapper {
            transition: margin-left 0.3s ease-in-out;
        }
        .sidebar-link.active {
            background-color: #166534; /* Darker Green */
            color: white;
        }
        /* Custom modal transition */
        #alert-modal-content {
            transition: opacity 0.2s ease-out, transform 0.2s ease-out;
        }
    </style>
</head>

    <script>
        // --- Configuration ---
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyWmhYQXVRSQvq03C_6ukEMUJn5fYGF7yyu6iFayrYRuzGFxEnBxk-1CKuTngaUd9Y/exec'; // <<-- ใส่ URL ของ Apps Script ที่ Deploy แล้ว

        // --- Global State ---
        let currentUser = null;
        let contractorDataCache = null;
        let branchesCache = [];
        let isDemoMode = false;
        let html5QrCode = null;

        // --- DOM Elements ---
        const loadingOverlay = document.getElementById('loading-overlay');
        const loginSection = document.getElementById('login-section');
        const registerSection = document.getElementById('register-section');
        const forgotPasswordSection = document.getElementById('forgot-password-section');
        const appLayout = document.getElementById('app-layout');
        const pageContent = document.getElementById('page-content');
        const pageTitle = document.getElementById('page-title');
        const modal = document.getElementById('generic-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        
        // --- Custom Alert/Prompt Modal Elements ---
        const alertModal = document.getElementById('alert-modal');
        const alertModalContent = document.getElementById('alert-modal-content');
        const alertModalIcon = document.getElementById('alert-modal-icon');
        const alertModalTitle = document.getElementById('alert-modal-title');
        const alertModalMessage = document.getElementById('alert-modal-message');
        const alertModalButtons = document.getElementById('alert-modal-buttons');
        const alertModalPromptWrapper = document.getElementById('alert-modal-prompt-input-wrapper');
        const alertModalPromptInput = document.getElementById('alert-modal-prompt-input');

        // --- Custom Alert/Prompt Functions ---
        function hideAlert() {
            alertModalContent.classList.add('opacity-0', 'translate-y-4');
            setTimeout(() => {
                alertModal.classList.add('hidden');
            }, 200);
        }

        function showAlert(message, type = 'info', title = '') {
            const icons = {
                success: { class: 'bg-green-100 text-green-600', icon: '<i class="fas fa-check"></i>', defaultTitle: 'สำเร็จ' },
                error: { class: 'bg-red-100 text-red-600', icon: '<i class="fas fa-times"></i>', defaultTitle: 'เกิดข้อผิดพลาด' },
                warning: { class: 'bg-yellow-100 text-yellow-600', icon: '<i class="fas fa-exclamation-triangle"></i>', defaultTitle: 'คำเตือน' },
                info: { class: 'bg-blue-100 text-blue-600', icon: '<i class="fas fa-info"></i>', defaultTitle: 'แจ้งเพื่อทราบ' }
            };

            const config = icons[type] || icons['info'];
            
            alertModalIcon.innerHTML = config.icon;
            alertModalIcon.className = `w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-4xl ${config.class}`;
            alertModalTitle.textContent = title || config.defaultTitle;
            alertModalMessage.textContent = message;
            alertModalPromptWrapper.classList.add('hidden');

            alertModalButtons.innerHTML = `<button type="button" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-green-700 text-base font-medium text-white hover:bg-green-800 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm">ตกลง</button>`;
            alertModalButtons.querySelector('button').onclick = hideAlert;

            alertModal.classList.remove('hidden');
            setTimeout(() => {
                alertModalContent.classList.remove('opacity-0', 'translate-y-4');
            }, 10);
        }

        function showPrompt(message, title = 'กรุณากรอกข้อมูล') {
            return new Promise((resolve) => {
                const config = { class: 'bg-blue-100 text-blue-600', icon: '<i class="fas fa-question"></i>' };
                
                alertModalIcon.innerHTML = config.icon;
                alertModalIcon.className = `w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-4xl ${config.class}`;
                alertModalTitle.textContent = title;
                alertModalMessage.textContent = message;
                
                alertModalPromptWrapper.classList.remove('hidden');
                alertModalPromptInput.value = '';

                const okButton = document.createElement('button');
                okButton.type = 'button';
                okButton.className = 'w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-green-700 text-base font-medium text-white hover:bg-green-800 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm';
                okButton.textContent = 'ตกลง';
                
                const cancelButton = document.createElement('button');
                cancelButton.type = 'button';
                cancelButton.className = 'mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm';
                cancelButton.textContent = 'ยกเลิก';

                alertModalButtons.innerHTML = '';
                alertModalButtons.appendChild(okButton);
                alertModalButtons.appendChild(cancelButton);

                const handleOk = () => {
                    hideAlert();
                    resolve(alertModalPromptInput.value);
                };
                
                const handleCancel = () => {
                    hideAlert();
                    resolve(null);
                };

                okButton.onclick = handleOk;
                cancelButton.onclick = handleCancel;
                alertModalPromptInput.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleOk();
                    }
                };

                alertModal.classList.remove('hidden');
                setTimeout(() => {
                    alertModalContent.classList.remove('opacity-0', 'translate-y-4');
                    alertModalPromptInput.focus();
                }, 10);
            });
        }

        // --- API Caller ---
        async function callAppsScript(action, params = {}) {
            const publicActions = ['checkLogin', 'registerUser', 'getBranches', 'forgotPassword'];
            if (!publicActions.includes(action) && currentUser) {
                params.currentUser = { username: currentUser.username, role: currentUser.role, branchId: currentUser.branchId };
            }

            if (isDemoMode) {
                console.log('DEMO MODE - Action:', action, 'Params:', params);
                showAlert('การดำเนินการในโหมดตัวอย่างสำเร็จ (ไม่มีการบันทึกข้อมูลจริง)', 'info');
                if (action === 'registerUser') {
                    showLoginView();
                }
                return { message: 'Demo action successful' };
            }

            showLoader();
            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, params }), redirect: 'follow'
                });
                const result = await response.json();
                if (result.status === 'error') throw new Error(result.message);
                return result.data;
            } catch (error) {
                console.error('API Call Error:', error);
                showAlert(error.message, 'error');
                throw error;
            } finally {
                hideLoader();
            }
        }
        
        // --- View Management & Navigation ---
        function showLoginView() {
            loginSection.classList.remove('hidden');
            loginSection.classList.add('flex');
            registerSection.classList.add('hidden');
            registerSection.classList.remove('flex');
            forgotPasswordSection.classList.add('hidden');
            forgotPasswordSection.classList.remove('flex');
            appLayout.classList.add('hidden');
        }

        function showRegisterView() {
            loginSection.classList.add('hidden');
            loginSection.classList.remove('flex');
            registerSection.classList.remove('hidden');
            registerSection.classList.add('flex');
            forgotPasswordSection.classList.add('hidden');
            forgotPasswordSection.classList.remove('flex');
            appLayout.classList.add('hidden');
            populateBranchDropdown('register-branch');
        }

        function showForgotPasswordView() {
            loginSection.classList.add('hidden');
            loginSection.classList.remove('flex');
            registerSection.classList.add('hidden');
            registerSection.classList.remove('flex');
            forgotPasswordSection.classList.remove('hidden');
            forgotPasswordSection.classList.add('flex');
            appLayout.classList.add('hidden');
        }

        function showDashboardView(user) {
            loginSection.classList.add('hidden');
            registerSection.classList.add('hidden');
            forgotPasswordSection.classList.add('hidden');
            appLayout.classList.remove('hidden');

            document.getElementById('user-name').textContent = user.name;
            document.getElementById('user-username').textContent = user.username;
            document.getElementById('sidebar-role').textContent = user.role;
            
            const menuContainer = document.getElementById('sidebar-menu');
            let menuItems = '';
            let defaultPage = '';

                    `;

                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    navigateTo(link.dataset.page);
                    if (window.innerWidth < 768) toggleSidebar();
                });
            });

            navigateTo(defaultPage);

        async function navigateTo(page) {
            // Stop scanner if navigating away from the scanner page
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(err => console.error("Error stopping scanner:", err));
            }

            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.classList.toggle('active', link.dataset.page === page);
            });
            
            pageContent.innerHTML = '';
            showLoader();

            try {
                switch(page) {
                    case 'admin-users':
                        pageTitle.textContent = 'จัดการผู้ใช้งาน';
                        await renderAdminUsersPage();
                        break;
                    case 'sectionmanager-permits':
                        pageTitle.textContent = 'รายการคำขอ (Section Manager)';
                        await renderApproverPermitsPage('SectionManager');
                        break;
                    case 'gm-permits':
                        pageTitle.textContent = 'รายการคำขอ (GM)';
                        await renderApproverPermitsPage('GM');
                        break;
                    case 'all-permits':
                        pageTitle.textContent = 'รายการ Work Permit ทั้งหมด';
                        await renderAllPermitsPage();
                        break;
                    case 'scanner':
                        pageTitle.textContent = 'สแกน QR Code';
                        await renderScannerPage();
                        break;
                    case 'contractor-dashboard':
                        pageTitle.textContent = 'ภาพรวม';
                        await renderContractorDashboardPage();
                        break;
                    case 'contractor-permits':
                        pageTitle.textContent = 'จัดการ Work Permits';
                        await renderContractorPermitsPage();
                        break;
                }
            } catch (error) {
                pageContent.innerHTML = `<p class="text-red-500">เกิดข้อผิดพลาดในการโหลดข้อมูลหน้าเพจ</p>`;
            } finally {
                hideLoader();
            }
        }

        async function handleSubmitPermit(e) {
            e.preventDefault();
            const selectedJobs = [];
            document.querySelectorAll('#job-description-options input[type="checkbox"]:checked').forEach(checkbox => {
                if (checkbox.id === 'job-other') {
                    const otherText = document.getElementById('job-other-text').value;
                    if (otherText) {
                        selectedJobs.push(`งานอื่นๆ: ${otherText}`);
                    }
                } else {
                    selectedJobs.push(checkbox.value);
                }
            });

            const safetyChecklistResults = [];
            const questions = document.querySelectorAll('#safety-checklist-options .checklist-item');
            questions.forEach((q, index) => {
                // The last item is the textarea, so we only process radio buttons up to index 12 (13 items)
                if (index < 13) {
                    const questionText = q.querySelector('label').textContent;
                    const selectedValue = q.querySelector(`input[name="safety-q${index+1}"]:checked`)?.value || 'ยังไม่เลือก';
                    safetyChecklistResults.push(`${questionText}: ${selectedValue}`);
                }
            });

            // Add the text from question 14
            const q14Text = document.getElementById('safety-q14-text').value;
            if (q14Text) {
                 safetyChecklistResults.push(`14. กรณีผลการตรวจ ไม่ใช่ ให้ระบุมาตรการการควบคุม: ${q14Text}`);
            }


            const permitData = {
                contractorUsername: currentUser.username,
                contractorName: currentUser.name,
                branchId: document.getElementById('permitBranch').value,
                projectId: document.getElementById('permitProject').value,
                primaryContactEmployeeId: document.getElementById('permitPrimaryContact').value,
                startDate: document.getElementById('permitStartDate').value,
                endDate: document.getElementById('permitEndDate').value,
                workTime: document.getElementById('permitWorkTime').value,
                jobDescription: selectedJobs.join('\n'),
                numWorkers: document.getElementById('permitNumWorkers').value,
                workerList: document.getElementById('permitWorkerList').value,
                ppe: document.getElementById('permitPPE').value,
                safetyChecklist: safetyChecklistResults.join('\n'),
            };
            await callAppsScript('submitWorkPermit', { permitData });
            if (!isDemoMode) {
                showAlert('ยื่นคำขอ Work Permit สำเร็จ', 'success');
                closeModal();
                navigateTo('contractor-permits');
            }
        }

        async function handleApprovalAction(permitId, newStatus) {
            const reason = document.getElementById('rejectionReason')?.value || '';
            if (newStatus === 'Rejected' && !reason) {
                showAlert('กรุณาระบุเหตุผลในการไม่อนุมัติ', 'warning');
                return;
            }
            const params = {
                permitId,
                newStatus,
                reason,
                approver: { username: currentUser.username, role: currentUser.role }
            };
            await callAppsScript('updatePermitApproval', params);
            if (!isDemoMode) {
                showAlert(`อัปเดตสถานะเป็น ${newStatus} สำเร็จ`, 'success');
                closeModal();
                if (currentUser.role === 'SectionManager') {
                    navigateTo('sectionmanager-permits');
                } else {
                    navigateTo(`${currentUser.role.toLowerCase()}-permits`);
                }
            }
        }

            if (!contractorDataCache || !contractorDataCache.employees) return 'N/A';

            return employee ? employee.EmployeeName : 'Unknown';
        }

        function getStatusClass(status) {
            if (!status) return 'bg-gray-200 text-gray-800';
            status = status.toLowerCase();
            if (status.includes('approved') || status.includes('active')) return 'status-approved';
            if (status.includes('rejected')) return 'status-rejected';
            if (status.includes('pending section manager')) return 'status-pending-hr';
            if (status.includes('pending gm')) return 'status-pending-gm';
            if (status === 'pending') return 'status-pending';
            return 'bg-gray-200 text-gray-800';
        }

            selectEl.innerHTML = '<option value="" disabled selected>กรุณาเลือกสาขา</option>';
            branchesCache.forEach(branch => {
                const option = document.createElement('option');
                option.value = branch.BranchID;
                option.textContent = branch.BranchName;
                selectEl.appendChild(option);
            });
        }

                "ได้มีการปิดกั้นพื้นที่บริเวณปฏิบัติงาน หรือใช้กรวยขวาง พร้อมทั้งติดป้ายเตือนอันตรายต่างๆแล้ว",
                "ได้รับอนุญาติการใช้ไฟฟ้า และมีตู้ไไฟฟ้าย่อยหรือการต่อพ่วงเต้าเสียบจากเจ้าหน้าที่ไฟฟ้าแล้ว",
                "ก่อนลงมือปฏิบัติงานมีการตรวจสอบความปลอดภัยก่อนทุกครั้ง เช่น ตรวจพื้นที่การทำงาน เครื่องจักร เครื่องมือ เครื่องใช้ไฟฟ้า จะต้องอยู่ในสภาพพร้อมใช้งาน และปลอดภัย",
                "มีการตัดกระแสไฟฟ้า/ปิดเครื่องจักรที่อาจก่อให้เกิดอันตรายขณะปฏิบัติงานพร้อมทั้งติดตั้งป้ายผู้ไม่เกี่ยวข้อง\"ห้ามเปิด/เดินเครื่องเด็ดขาด\"",
                "พื้นที่ปฏิบัติงานอยู่ในพื้นที่ที่ปลอดภัย /อากาศถ่ายเท หรือมีการระบายอากาศที่เพียงพอ",
                "ได้รับการอบรมความปลอดภัย/ได้รับการแจ้งเตือนอันตราย และมาตรการควบคุม หรือวิธีป้องกันอันตรายให้กับให้กับผู้ปฏิบัติงานทุกคนทราบ",
                "กรณีปฏิบัติงานในที่อับอากาศผู้ปฏิบัติต้องเป็นผู้ที่ผ่านการฝึกอบรมตามที่กฎหมายกำหนด",
                "กรณีปฏิบัติงานในที่อับอากาศต้องมีแผนการปฏิบัติงาน ขั้นตอนการปฏิบัติงาน กำหนดผู้ปฏิบัติงานอย่างชัดเจน",
                "กรณีปฏิบัติงานอากาศในที่อับอากาศก่อนเข้าปฏิบัติงานต้องอยู่ในค่าที่ปลอดภัย กรณีไม่ปลอดภัยต้องสวมใส่อุปกรณ์ช่วยชีวิตก่อนเข้าปฏิบัติงาน"
            ];
            
            container.innerHTML = '';
            questions.forEach((q, index) => {
                const qId = index + 1;
                const item = document.createElement('div');
                item.className = 'checklist-item border-t pt-3';
                item.innerHTML = `
                    <label class="block text-sm text-gray-900">${qId}. ${q}</label>
                    <div class="flex items-center space-x-4 mt-1">
                        <div class="flex items-center">
                            <input id="q${qId}-yes" name="safety-q${qId}" type="radio" value="ใช่" class="h-4 w-4 text-green-600 border-gray-300">
                            <label for="q${qId}-yes" class="ml-2 block text-sm text-gray-700">ใช่</label>
                        </div>
                        <div class="flex items-center">
                            <input id="q${qId}-no" name="safety-q${qId}" type="radio" value="ไม่ใช่" class="h-4 w-4 text-green-600 border-gray-300">
                            <label for="q${qId}-no" class="ml-2 block text-sm text-gray-700">ไม่ใช่</label>
                        </div>
                        <div class="flex items-center">
                            <input id="q${qId}-na" name="safety-q${qId}" type="radio" value="ไม่เกี่ยวข้อง" class="h-4 w-4 text-green-600 border-gray-300">
                            <label for="q${qId}-na" class="ml-2 block text-sm text-gray-700">ไม่เกี่ยวข้อง</label>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });

            // Add question 14
            const q14Item = document.createElement('div');
            q14Item.className = 'checklist-item border-t pt-3';
            q14Item.innerHTML = `
                <label for="safety-q14-text" class="block text-sm text-gray-900">14. กรณีผลการตรวจ ไม่ใช่ ให้ระบุมาตรการการควบคุม</label>
                <textarea id="safety-q14-text" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></textarea>
            `;
            container.appendChild(q14Item);
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', async () => {
            // Fetch branches on initial load to cache them
            try {
                const data = await callAppsScript('getBranches');
                branchesCache = data.branches;
            } catch (e) {
                console.error("Could not fetch branches on initial load.", e);
                showAlert("ไม่สามารถโหลดข้อมูลสาขาได้ กรุณาลองอีกครั้ง", "error");
            }

            const storedUser = sessionStorage.getItem('workPermitUser');
            if (storedUser) {
                currentUser = JSON.parse(storedUser);
                showDashboardView(currentUser);
            } else {
                showLoginView();
            }
        });
    </script>
</body>
</html>
