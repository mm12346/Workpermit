<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Permit Management</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <!-- QR Code Generator Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <!-- QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        /* Custom styles */
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f0f2f5;
        }
        .hidden { display: none; }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #166534; /* Dark Green */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-pending-hr, .status-pending { background-color: #fef3c7; color: #92400e; }
        .status-pending-gm { background-color: #dbeafe; color: #1e40af; }
        .status-approved, .status-active { background-color: #d1fae5; color: #065f46; }
        .status-rejected { background-color: #fee2e2; color: #991b1b; }
        .status-closed { background-color: #e5e7eb; color: #4b5563; }
        
        /* Sidebar styles */
        #sidebar {
            transition: transform 0.3s ease-in-out;
        }
        #main-content-wrapper {
            transition: margin-left 0.3s ease-in-out;
        }
        .sidebar-link.active {
            background-color: #166534; /* Darker Green */
            color: white;
        }
        /* Custom modal transition */
        #alert-modal-content {
            transition: opacity 0.2s ease-out, transform 0.2s ease-out;
        }
        #qr-reader {
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }
        
        /* A class to hide elements when printing the main screen, but not the report */
        @media print {
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Main Container -->
    <div id="app" class="w-full">

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="loader"></div>
        </div>
        
        <!-- Login Section -->
        <div id="login-section" class="hidden min-h-screen flex items-center justify-center">
            <div class="max-w-sm mx-auto p-4 w-full">
                <!-- Logo -->
                <div class="text-center mb-8">
                    <svg class="h-20 w-auto mx-auto" viewBox="0 0 100 100" fill="#14532d">
                       <path d="M50,5A45,45,0,1,1,5,50,45,45,0,0,1,50,5M50,0a50,50,0,1,0,50,50A50,50,0,0,0,50,0Z"/>
                       <path d="M50,25a8,8,0,0,1,8,8v8a8,8,0,0,1-16,0v-8a8,8,0,0,1,8-8m0-5a13,13,0,0,0-13,13v8a13,13,0,0,0,26,0v-8A13,13,0,0,0,50,20Z"/>
                       <path d="M50,55a20,20,0,0,1,20,20v5a0,0,0,0,1,0,0H30a0,0,0,0,1,0,0v-5a20,20,0,0,1,20-20m0-5a25,25,0,0,0-25,25v5a5,5,0,0,0,5,5H70a5,5,0,0,0,5-5v-5A25,25,0,0,0,50,50Z"/>
                    </svg>
                    <h2 class="text-2xl font-bold text-gray-700 mt-2">WORK PERMIT</h2>
                </div>

                <!-- Login Form -->

        <!-- Generic Modal for Forms -->

    <script>
        // --- Configuration ---
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyWmhYQXVRSQvq03C_6ukEMUJn5fYGF7yyu6iFayrYRuzGFxEnBxk-1CKuTngaUd9Y/exec'; // <<-- ใส่ URL ของ Apps Script ที่ Deploy แล้ว

        // --- Global State ---
        let currentUser = null;
        let contractorDataCache = null;
        let branchesCache = [];
        let isDemoMode = false;
        let html5QrCode = null; // To hold the scanner instance

        // --- DOM Elements ---
        const loadingOverlay = document.getElementById('loading-overlay');
        const loginSection = document.getElementById('login-section');
        const registerSection = document.getElementById('register-section');
        const forgotPasswordSection = document.getElementById('forgot-password-section');
        const permitCheckSection = document.getElementById('permit-check-section');
        const appLayout = document.getElementById('app-layout');
        const pageContent = document.getElementById('page-content');
        const pageTitle = document.getElementById('page-title');
        const modal = document.getElementById('generic-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        
        // --- Custom Alert/Prompt Modal Elements ---
        const alertModal = document.getElementById('alert-modal');
        const alertModalContent = document.getElementById('alert-modal-content');
        const alertModalIcon = document.getElementById('alert-modal-icon');
        const alertModalTitle = document.getElementById('alert-modal-title');
        const alertModalMessage = document.getElementById('alert-modal-message');
        const alertModalButtons = document.getElementById('alert-modal-buttons');
        const alertModalPromptWrapper = document.getElementById('alert-modal-prompt-input-wrapper');
        const alertModalPromptInput = document.getElementById('alert-modal-prompt-input');

        // --- Custom Alert/Prompt Functions ---
        function hideAlert() {
            alertModalContent.classList.add('opacity-0', 'translate-y-4');
            setTimeout(() => {
                alertModal.classList.add('hidden');
            }, 200);
        }

        function showAlert(message, type = 'info', title = '') {
            const icons = {
                success: { class: 'bg-green-100 text-green-600', icon: '<i class="fas fa-check"></i>', defaultTitle: 'สำเร็จ' },
                error: { class: 'bg-red-100 text-red-600', icon: '<i class="fas fa-times"></i>', defaultTitle: 'เกิดข้อผิดพลาด' },
                warning: { class: 'bg-yellow-100 text-yellow-600', icon: '<i class="fas fa-exclamation-triangle"></i>', defaultTitle: 'คำเตือน' },
                info: { class: 'bg-blue-100 text-blue-600', icon: '<i class="fas fa-info"></i>', defaultTitle: 'แจ้งเพื่อทราบ' }
            };

            const config = icons[type] || icons['info'];
            
            alertModalIcon.innerHTML = config.icon;
            alertModalIcon.className = `w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-4xl ${config.class}`;
            alertModalTitle.textContent = title || config.defaultTitle;
            alertModalMessage.textContent = message;
            alertModalPromptWrapper.classList.add('hidden');

            alertModalButtons.innerHTML = `<button type="button" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-green-700 text-base font-medium text-white hover:bg-green-800 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm">ตกลง</button>`;
            alertModalButtons.querySelector('button').onclick = hideAlert;

            alertModal.classList.remove('hidden');
            setTimeout(() => {
                alertModalContent.classList.remove('opacity-0', 'translate-y-4');
            }, 10);
        }

        function showPrompt(message, title = 'กรุณากรอกข้อมูล') {
            return new Promise((resolve) => {
                const config = { class: 'bg-blue-100 text-blue-600', icon: '<i class="fas fa-question"></i>' };
                
                alertModalIcon.innerHTML = config.icon;
                alertModalIcon.className = `w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-4xl ${config.class}`;
                alertModalTitle.textContent = title;
                alertModalMessage.textContent = message;
                
                alertModalPromptWrapper.classList.remove('hidden');
                alertModalPromptInput.value = '';

                const okButton = document.createElement('button');
                okButton.type = 'button';
                okButton.className = 'w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-green-700 text-base font-medium text-white hover:bg-green-800 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm';
                okButton.textContent = 'ตกลง';
                
                const cancelButton = document.createElement('button');
                cancelButton.type = 'button';
                cancelButton.className = 'mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm';
                cancelButton.textContent = 'ยกเลิก';

                alertModalButtons.innerHTML = '';
                alertModalButtons.appendChild(okButton);
                alertModalButtons.appendChild(cancelButton);

                const handleOk = () => {
                    hideAlert();
                    resolve(alertModalPromptInput.value);
                };
                
                const handleCancel = () => {
                    hideAlert();
                    resolve(null);
                };

                okButton.onclick = handleOk;
                cancelButton.onclick = handleCancel;
                alertModalPromptInput.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleOk();
                    }
                };

                alertModal.classList.remove('hidden');
                setTimeout(() => {
                    alertModalContent.classList.remove('opacity-0', 'translate-y-4');
                    alertModalPromptInput.focus();
                }, 10);
            });
        }

        // --- API Caller ---
        async function callAppsScript(action, params = {}) {
            const publicActions = ['checkLogin', 'registerUser', 'getBranches', 'forgotPassword', 'getPublicPermitDetails'];
            if (!publicActions.includes(action) && currentUser) {
                params.currentUser = { username: currentUser.username, role: currentUser.role, branchId: currentUser.branchId };
            }

            if (isDemoMode) {
                console.log('DEMO MODE - Action:', action, 'Params:', params);
                showAlert('การดำเนินการในโหมดตัวอย่างสำเร็จ (ไม่มีการบันทึกข้อมูลจริง)', 'info');
                if (action === 'registerUser') {
                    showLoginView();
                }
                return { message: 'Demo action successful' };
            }

            showLoader();
            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, params }), redirect: 'follow'
                });
                const result = await response.json();
                if (result.status === 'error') throw new Error(result.message);
                return result.data;
            } catch (error) {
                console.error('API Call Error:', error);
                showAlert(error.message, 'error');
                throw error;
            } finally {
                hideLoader();
            }
        }
        
        // --- View Management & Navigation ---
        function showLoginView() {
            loginSection.classList.remove('hidden');
            loginSection.classList.add('flex');
            registerSection.classList.add('hidden');
            registerSection.classList.remove('flex');
            forgotPasswordSection.classList.add('hidden');
            forgotPasswordSection.classList.remove('flex');
            permitCheckSection.classList.add('hidden');
            appLayout.classList.add('hidden');
        }

        function showRegisterView() {
            loginSection.classList.add('hidden');
            loginSection.classList.remove('flex');
            registerSection.classList.remove('hidden');
            registerSection.classList.add('flex');
            forgotPasswordSection.classList.add('hidden');
            forgotPasswordSection.classList.remove('flex');
            permitCheckSection.classList.add('hidden');
            appLayout.classList.add('hidden');

        async function navigateTo(page) {
            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.classList.toggle('active', link.dataset.page === page);
            });
            
            pageContent.innerHTML = '';
            showLoader();

            try {
                switch(page) {
                    case 'admin-users':
                        pageTitle.textContent = 'จัดการผู้ใช้งาน';
                        await renderAdminUsersPage();
                        break;
                    case 'sectionmanager-permits':
                        pageTitle.textContent = 'รายการคำขอ (Section Manager)';
                        await renderApproverPermitsPage('SectionManager');
                        break;
                    case 'gm-permits':
                        pageTitle.textContent = 'รายการคำขอ (GM)';
                        await renderApproverPermitsPage('GM');
                        break;
                    case 'all-permits':
                        pageTitle.textContent = 'รายการ Work Permit ทั้งหมด';
                        await renderAllPermitsPage();
                        break;
                    case 'contractor-dashboard':
                        pageTitle.textContent = 'ภาพรวม';
                        await renderContractorDashboardPage();
                        break;
                    case 'contractor-permits':
                        pageTitle.textContent = 'จัดการ Work Permits';
                        await renderContractorPermitsPage();
                        break;
                    case 'check-permit':
                        pageTitle.textContent = 'ตรวจสอบ Work Permit';
                        renderCheckPermitPage(pageContent);
                        break;
                }
            } catch (error) {
                pageContent.innerHTML = `<p class="text-red-500">เกิดข้อผิดพลาดในการโหลดข้อมูลหน้าเพจ</p>`;
            } finally {
                hideLoader();
            }
        }

            let tableHtml = '<table class="min-w-full divide-y divide-gray-200 text-sm"><thead><tr><th class="px-2 py-2 text-left font-medium text-gray-600">หัวข้อการตรวจสอบ</th><th class="px-2 py-2 text-left font-medium text-gray-600">ผลการตรวจ</th></tr></thead><tbody class="bg-white divide-y divide-gray-200">';
            
            lines.forEach(line => {
                const parts = line.split(':');
                const question = parts.shift();
                const answer = parts.join(':').trim();
                tableHtml += `<tr><td class="px-2 py-2 align-top text-gray-700">${question}</td><td class="px-2 py-2 align-top font-medium text-gray-900">${answer}</td></tr>`;
            });

            tableHtml += '</tbody></table>';
            return tableHtml;
        }

        function handleDownloadQR(permitId) {
            const qrCodeElement = document.getElementById('qrcode');
            if (!qrCodeElement) { showAlert('ไม่พบ QR Code', 'error'); return; }
            const qrCodeImage = qrCodeElement.querySelector('img');
            if (!qrCodeImage) { showAlert('ไม่พบรูปภาพ QR Code', 'error'); return; }

            const canvas = document.createElement('canvas');
            const padding = 20;
            const textHeight = 30;
            const qrSize = qrCodeImage.width;
            
            canvas.width = qrSize + (padding * 2);
            canvas.height = qrSize + (padding * 2) + textHeight;
            
            const ctx = canvas.getContext('2d');
            
            // White background
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw QR Code
            ctx.drawImage(qrCodeImage, padding, padding, qrSize, qrSize);
            
            // Draw Permit ID text
            ctx.fillStyle = 'black';
            ctx.font = '16px Kanit, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(permitId, canvas.width / 2, qrSize + padding + 20);

            // Trigger download
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `work-permit-qr-${permitId}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- Permit Checker Functions ---
        async function handlePublicSearch(permitId) {
            if (!permitId || permitId.trim() === '') {
                showAlert('กรุณากรอก Permit ID', 'warning');
                return;
            }
            try {
                const permitDetails = await callAppsScript('getPublicPermitDetails', { permitId: permitId.trim() });
                renderPublicPermitDetails(permitDetails);
            } catch (error) {
                // showAlert is already called in callAppsScript
            }
        }

        function startQrScanner(readerId, statusId) {
            const statusEl = document.getElementById(statusId);
            if (html5QrCode && html5QrCode.isScanning) {
                stopQrScanner(readerId, statusId);
                return;
            }

            html5QrCode = new Html5Qrcode(readerId);
            const qrCodeSuccessCallback = (decodedText, decodedResult) => {
                console.log(`Code matched = ${decodedText}`, decodedResult);
                stopQrScanner(readerId, statusId);
                
                // The QR code now directly contains the PermitID
                const permitId = decodedText;

                handlePublicSearch(permitId);
            };
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            
            statusEl.textContent = 'กำลังเปิดกล้อง...';
            document.getElementById(readerId).innerHTML = ''; // Clear previous content
            html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback)
                .then(() => {
                    statusEl.textContent = 'เล็งกล้องไปที่ QR Code';
                    const scanButton = document.querySelector(`button[id^="scan-qr-btn-"]`);
                    if(scanButton) scanButton.innerHTML = '<i class="fas fa-stop-circle"></i> หยุดสแกน';
                })
                .catch(err => {
                    console.error("QR Scanner Error:", err);
                    statusEl.textContent = 'ไม่สามารถเปิดกล้องได้';
                    showAlert('ไม่สามารถเข้าถึงกล้องได้ กรุณาตรวจสอบการอนุญาต', 'error');
                });
        }

        function stopQrScanner(readerId, statusId) {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    console.log("QR Code scanning stopped.");
                    document.getElementById(readerId).innerHTML = '';
                    document.getElementById(statusId).textContent = '';
                    const scanButton = document.querySelector(`button[id^="scan-qr-btn-"]`);
                    if(scanButton) scanButton.innerHTML = '<i class="fas fa-qrcode"></i> สแกน QR Code';
                }).catch(err => {
                    console.error("Failed to stop scanner:", err);
                });
            }
        }

        async function refreshContractorData() {
            if (isDemoMode && contractorDataCache) return;
            const data = await callAppsScript('getContractorDashboardData');
            contractorDataCache = data;
        }

        function getEmployeeName(employeeId) {
            if (!contractorDataCache || !contractorDataCache.employees) return 'N/A';
            const employee = contractorDataCache.employees.find(e => e.EmployeeID === employeeId);
            return employee ? employee.EmployeeName : 'Unknown';
        }

        function getStatusClass(status) {
            if (!status) return 'bg-gray-200 text-gray-800';
            status = status.toLowerCase();
            if (status.includes('approved') || status.includes('active')) return 'status-approved';
            if (status.includes('rejected')) return 'status-rejected';
            if (status.includes('pending section manager')) return 'status-pending-hr';
            if (status.includes('pending gm')) return 'status-pending-gm';
            if (status.includes('closed')) return 'status-closed';
            if (status === 'pending') return 'status-pending';
            return 'bg-gray-200 text-gray-800';
        }
        
        async function populateBranchDropdown(elementId) {
            if (branchesCache.length === 0) {
                const data = await callAppsScript('getBranches');
                branchesCache = data.branches;
            }
            const selectEl = document.getElementById(elementId);
            selectEl.innerHTML = '<option value="" disabled selected>กรุณาเลือกสาขา</option>';
            branchesCache.forEach(branch => {
                const option = document.createElement('option');
                option.value = branch.BranchID;
                option.textContent = branch.BranchName;
                selectEl.appendChild(option);
            });
        }
